replicaCount: 1
image:
  repository: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/web-app
  pullPolicy: Always
  tag: "latest"
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
env:
  - name: VUE_APP_API_URL
    value: "http://api-app:8080"
